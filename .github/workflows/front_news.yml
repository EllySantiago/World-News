name: Bot Frontend Pulse

on:
  schedule:
    - cron: '30 9 * * *' # 06:30 BRT
  workflow_dispatch:

jobs:
  run-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - env:
          DISCORD_WEBHOOK_FRONT: ${{ secrets.DISCORD_WEBHOOK_FRONT }}
        run: python front.py

name: Run channel

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

jobs:
  run-channel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_IA_OSINT: ${{ secrets.DISCORD_WEBHOOK_IA_OSINT }}
          DISCORD_WEBHOOK_FRONT: ${{ secrets.DISCORD_WEBHOOK_FRONT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python bot.py --dry-run ${{ inputs.channel }}
          else
            python bot.py ${{ inputs.channel }}
          fi

      - name: Commit state if needed
        if: ${{ always() && !inputs.dry_run }}
        env:
          CHANNEL_NAME: ${{ inputs.channel }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: estado do canal ${CHANNEL_NAME}"
          git pull --rebase
          git push
